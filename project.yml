name: GetOut
options:
  bundleIdPrefix: com.getout
  deploymentTarget:
    iOS: "17.0"
targets:
  GetOut:
    type: application
    platform: iOS
    sources:
      - GetOut
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: GetOut/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1"
      PRODUCT_BUNDLE_IDENTIFIER: com.parth.getout
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GetOut uses your location to show great spots near you."
      INFOPLIST_KEY_NSContactsUsageDescription: "GetOut finds friends you already know from your contacts."
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: GetOut/GetOut.entitlements
      # Fill in your Apple Developer Team ID to enable signing and CloudKit on device.
      DEVELOPMENT_TEAM: "3W3G74V42R"
  GetOutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GetOutTests
    dependencies:
      - target: GetOut
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.parth.getout.tests
      SWIFT_VERSION: "5.0"
