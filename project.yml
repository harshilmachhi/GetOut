name: GetOut
options:
  bundleIdPrefix: com.getout
  deploymentTarget:
    iOS: "17.0"
targets:
  GetOut:
    type: application
    platform: iOS
    sources:
      - GetOut
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1"
      PRODUCT_BUNDLE_IDENTIFIER: com.getout.app
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GetOut uses your location to show great spots near you."
